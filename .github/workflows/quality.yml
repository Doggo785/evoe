name: quality

# Enforces the blocking gates from CONSTRAINTS.md. Anything here fails the build.
# Coverage thresholds and release-only guards (verifyExtensionAbi,
# verifyCleanKotlinOutput) stay out: they need minified release builds.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: detekt (zero errors, default config)
        run: ./gradlew detekt

      - name: unit tests + kover report
        run: ./gradlew test koverXmlReport

      - name: :common ABI unchanged or dump committed
        run: ./gradlew :common:checkKotlinAbi

      - name: dependency vulnerabilities (fail on high/critical)
        run: |
          ./gradlew cyclonedxBom
          curl -sSL https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan \
            --sbom app/build/reports/cyclonedx/bom.json \
            --sbom common/build/reports/cyclonedx/bom.json \
            --sbom deezer-extension/ext/build/reports/cyclonedx/bom.json \
            --format json > /tmp/osv.json
          python3 - <<'EOF'
          import json, sys
          bad = []
          d = json.load(open("/tmp/osv.json"))
          for r in d.get("results", []):
              src = r.get("source", {}).get("path", "?")
              for x in r.get("packages", []):
                  p = x.get("package", {})
                  for v in x.get("vulnerabilities", []):
                      why = []
                      for s in v.get("severity", []):
                          if s.get("type") == "CVSS_V3":
                              try:
                                  if float(s["score"]) >= 7.0:
                                      why.append("CVSS_V3 %s" % s["score"])
                              except ValueError:
                                  pass
                      if v.get("database_specific", {}).get("severity", "").upper() in ("HIGH", "CRITICAL"):
                          why.append(v["database_specific"]["severity"])
                      if why:
                          bad.append("%s %s (%s) in %s" % (p.get("name"), p.get("version"), ", ".join(why), src))
          if bad:
              print("HIGH/CRITICAL vulnerabilities:")
              print("\n".join("  - " + b for b in bad))
              sys.exit(1)
          print("osv gate: no high/critical vulnerabilities")
          EOF

      - name: no new secrets (known findings pinned in baseline)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --baseline-path .gitleaksbaseline
