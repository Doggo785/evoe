name: release-apk

# Manual proof that the release build stays green, without touching any
# release. Uploads the APK as a workflow artifact for inspection.
#
# There is deliberately NO `on: release` trigger here. Releases are cut
# through the automatic token, which starts no new workflow runs (loop
# protection) — observed 2026-10-04, when v3.2.0 published with zero assets
# and no run started. The real upload lives in release-please.yml, inside the
# run that creates the release. Do not re-add a release trigger here; it
# would look alive and never fire.
#
# Guards mirror the upload path: exactly one APK, and it must carry the
# -release marker (a debug APK was once uploaded to GitHub unnoticed because
# the names were identical apart from that marker — see archivesName in
# app/build.gradle.kts).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionCode comes from `git rev-list --count HEAD`,
          # a shallow clone would report 1 and break upgrade monotonicity.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      # No android-actions/setup-android: v3 crashes installing the obsolete
      # 'tools' package (sdkmanager exit 1). Runners ship an SDK but sdkmanager
      # is not on PATH; use the full path (mirrors quality.yml).
      - name: Android platform 37 + build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"

      # Runs the release guards as a side effect: verifyExtensionAbi runs as a
      # finalizer of minify*WithR8 and verifyCleanKotlinOutput is a dependency
      # of assembleRelease. Signed with the pinned shared debug key
      # (keystores/debug.keystore), same identity as the shipped releases.
      - name: release apk (R8 + ABI and clean-output guards)
        run: ./gradlew :app:assembleRelease

      - name: verify exactly one release apk
        run: |
          set -euo pipefail
          # ls fails when the glob matches nothing, and pipefail + set -e would
          # exit the script before the count check below runs. `|| true` keeps
          # the pipeline alive so the check reports the failure with its own
          # message instead of ls's raw error.
          APK_COUNT=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | wc -l || true)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "expected exactly 1 apk in app/build/outputs/apk/release/, found $APK_COUNT"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "built: $APK"
          case "$APK" in
            *-release.apk) ;;
            *)
              echo "refusing to keep $APK: the file must carry the -release marker"
              exit 1
              ;;
          esac

      - name: upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
